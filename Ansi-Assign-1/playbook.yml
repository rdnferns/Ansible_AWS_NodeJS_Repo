---
- name: Install Node.js App
  hosts: webservers
  become: yes
  vars:
    repo_url: "https://github.com/rat9615/simple-nodejs-app.git"  # replacable with another public repo, but don't forget to make the required changes here.
    app_dir: "/app"


  tasks:
    - name: Update instance cache & Upgrade package Libraries.
      ansible.builtin.apt:
        update_cache: true
        upgrade: true


    - name: Ensure required packages are installed
      ansible.builtin.package:
        name:
          - curl
          - tar
          - git
        state: present


    - name: Ensuring a target directory exists.
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'
        owner: root
        group: root


    - name: Cloning the git repo into the directory.
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: /opt/my-app/
        version: "master"


    - name: Transfering the files to the working directory.
      ansible.builtin.copy:
        src: /opt/my-app/
        dest: "{{ app_dir }}"
        remote_src: yes
        mode: '0644'
        owner: root
        group: root


    - name: Removing Unwanted files.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /app/Dockerfile
        - /app/.gitignore
        - /app/README.md


    - name: Update cache & Upgrade packages once again, for installing Node.js.
      ansible.builtin.apt:
        update_cache: true
        upgrade: true


    - name: Install NVM.
      ansible.builtin.shell:
        cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh | bash
      args:
        executable: /bin/bash
        creates: /root/.nvm/nvm.sh


    - name: Install Node.js LTS
      ansible.builtin.shell:
        cmd: source /root/.nvm/nvm.sh && nvm install --lts
      args:
        executable: /bin/bash


    - name: Install application dependencies
      ansible.builtin.shell:
        cmd: source /root/.nvm/nvm.sh && npm ci
        chdir: "{{ app_dir }}"
      args:
        executable: /bin/bash


    - name: Install PM2 globally
      ansible.builtin.shell:
        cmd: source /root/.nvm/nvm.sh && npm install -g pm2
      args:
        executable: /bin/bash
        creates: /root/.nvm/versions/node/*/bin/pm2


    - name: Check whether application is already running in PM2
      ansible.builtin.shell:
        cmd: source /root/.nvm/nvm.sh && pm2 describe my-app
      args:
        executable: /bin/bash
      register: pm2_status
      changed_when: false
      failed_when: false


    - name: Start Node.js application using PM2
      ansible.builtin.shell:
        cmd: source /root/.nvm/nvm.sh && pm2 start npm --name my-app -- start -- --host 0.0.0.0
        chdir: "{{ app_dir }}"
      args:
        executable: /bin/bash
      when: pm2_status.rc != 0


    - name: Save PM2 process list
      ansible.builtin.shell:
        cmd: source /root/.nvm/nvm.sh && pm2 save
      args:
        executable: /bin/bash


